name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: openclaw

      # The contract repository sits next to this one, as on a developer machine.
      - uses: actions/checkout@v4
        with:
          repository: lumoauth/agent-guard
          path: agent-guard

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openclaw/package-lock.json

      - name: Install
        working-directory: openclaw
        run: npm ci

      - name: Type check
        working-directory: openclaw
        run: npm run typecheck

      - name: Build
        working-directory: openclaw
        run: npm run build

      - name: Test
        working-directory: openclaw
        run: npm test

      - name: Contract copy matches agent-guard
        working-directory: openclaw
        run: npm run check-contract

      - name: Package contents
        working-directory: openclaw
        run: npm pack --dry-run
